[project]
name = "production-rag-knowledge-system"
version = "0.1.0"
description = "A clean, production-grade Retrieval-Augmented Generation (RAG) system built from fundamentals."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Ashok" }
]
dependencies = [
    "python-dotenv>=1.0.1",
    "pydantic>=2.7.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/production_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
